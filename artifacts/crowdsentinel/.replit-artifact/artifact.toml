kind = "web"
previewPath = "/"
title = "CrowdSentinel"
description = "A public-safety monitoring application that analyzes crowd footage, surfaces measurable density and movement conditions, and explains configurable crowd-risk alerts for safety teams."
version = "1.0.0"
id = "artifacts/crowdsentinel"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22995

[services.development]
run = "pnpm --filter @workspace/crowdsentinel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crowdsentinel", "run", "build" ]
serve = "static"
publicDir = "artifacts/crowdsentinel/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22995"
BASE_PATH = "/"
